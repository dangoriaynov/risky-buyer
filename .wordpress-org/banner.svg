<svg xmlns="http://www.w3.org/2000/svg" width="772" height="250" viewBox="0 0 772 250" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#c02726"/>
    </linearGradient>
  </defs>
  <rect width="772" height="250" fill="url(#bg)"/>

  <!-- shield emblem (left) -->
  <g transform="translate(118,125) scale(1.28)">
    <path d="M0 -74 L60 -52 V0 C60 42 32 70 0 84 C-32 70 -60 42 -60 0 V-52 Z" fill="url(#shield)"/>
    <rect x="-9" y="-44" width="18" height="62" rx="9" fill="#ffffff"/>
    <circle cx="0" cy="40" r="11" fill="#ffffff"/>
  </g>

  <!-- text -->
  <text x="232" y="120" fill="#ffffff" font-size="66" font-weight="700" letter-spacing="-1">RiskyBuyer</text>
  <text x="235" y="162" fill="#cbd5e1" font-size="26">Flag problematic WooCommerce customers</text>
  <text x="235" y="197" fill="#9aa6b6" font-size="20">by phone or name — fake &amp; uncollected orders</text>
</svg>
